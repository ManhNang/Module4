<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Thêm mới Tỉnh thành</title>
  </head>
  <body>
    <div th:replace="~{layout :: body}"></div>
    <h2>Thêm mới Tỉnh thành</h2>
    <p class="message" th:if="${message}" th:text="${message}"></p>
    <form
      th:action="@{/provinces/create}"
      th:object="${province}"
      method="post"
    >
      <div>
        <label>Tên tỉnh thành:</label>
        <input type="text" th:field="*{name}" required />
      </div>
      <br />
      <button type="submit">Lưu</button>
      <a th:href="@{/provinces}">Quay lại</a>
    </form>
  </body>
</html>
