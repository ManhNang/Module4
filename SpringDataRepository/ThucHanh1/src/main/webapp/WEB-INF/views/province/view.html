<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Chi tiết Tỉnh thành</title>
  </head>
  <body>
    <div th:replace="~{layout :: body}"></div>
    <h2>Tỉnh thành: <span th:text="${province.name}"></span></h2>
    <h3>Danh sách Khách hàng thuộc tỉnh này:</h3>

    <table>
      <thead>
        <tr>
          <th>Họ</th>
          <th>Tên</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="c : ${customers}">
          <td th:text="${c.firstName}"></td>
          <td th:text="${c.lastName}"></td>
        </tr>
      </tbody>
    </table>
    <br />
    <a th:href="@{/provinces}">Quay lại danh sách tỉnh</a>
  </body>
</html>
