<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Customer & Province Management</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      nav {
        margin-bottom: 20px;
        background-color: #f2f2f2;
        padding: 10px;
      }
      nav a {
        margin-right: 15px;
        text-decoration: none;
        color: #333;
        font-weight: bold;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #4caf50;
        color: white;
      }
      .message {
        color: green;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <nav>
      <a th:href="@{/customers}">Quản lý Khách hàng</a>
      <a th:href="@{/provinces}">Quản lý Tỉnh thành</a>
    </nav>
  </body>
</html>
