plugins {
    id 'java'
    id 'war'
}

group = 'com.codegym'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Servlet API 6.0 (Tomcat 10.1+ / Jakarta EE 10)
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // Spring Web MVC 6.2.6
    implementation 'org.springframework:spring-webmvc:6.2.6'

    // Jakarta JSTL API & Glassfish Implementation
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    runtimeOnly 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    // Unit Testing
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('war') {
    archiveFileName = 'spring-greeting.war'
}

tasks.named('test') {
    useJUnitPlatform()
}
