<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập nhật thông tin sản phẩm - Quản lý sản phẩm</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/products}">
            <i class="bi bi-box-seam me-2"></i>Product Manager
        </a>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/products}" class="text-decoration-none">Sản phẩm</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Cập nhật sản phẩm #<span th:text="${product.id}"></span></li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-warning text-dark py-3">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Cập nhật thông tin sản phẩm</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/products/update}" th:object="${product}" method="post" novalidate>
                        <!-- ID ẩn -->
                        <input type="hidden" th:field="*{id}" />

                        <!-- Mã sản phẩm hiển thị readonly -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted">Mã sản phẩm (ID)</label>
                            <input type="text" class="form-control bg-light" th:value="*{id}" readonly disabled>
                        </div>

                        <!-- Tên sản phẩm -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">
                                Tên sản phẩm <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   class="form-control" placeholder="Nhập tên sản phẩm">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                Lỗi tên sản phẩm
                            </div>
                        </div>

                        <!-- Giá sản phẩm -->
                        <div class="mb-3">
                            <label for="price" class="form-label fw-semibold">
                                Giá sản phẩm (VNĐ) <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <input type="number" id="price" step="1000" min="0" th:field="*{price}"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                       class="form-control" placeholder="Nhập giá sản phẩm">
                                <span class="input-group-text">₫</span>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">
                                    Lỗi giá sản phẩm
                                </div>
                            </div>
                        </div>

                        <!-- Nhà sản xuất -->
                        <div class="mb-3">
                            <label for="manufacturer" class="form-label fw-semibold">
                                Nhà sản xuất <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="manufacturer" th:field="*{manufacturer}"
                                   th:classappend="${#fields.hasErrors('manufacturer')} ? 'is-invalid' : ''"
                                   class="form-control" placeholder="Nhập hãng sản xuất">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('manufacturer')}" th:errors="*{manufacturer}">
                                Lỗi nhà sản xuất
                            </div>
                        </div>

                        <!-- Mô tả -->
                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold">Mô tả sản phẩm</label>
                            <textarea id="description" th:field="*{description}" rows="4"
                                      class="form-control" placeholder="Nhập mô tả sản phẩm"></textarea>
                        </div>

                        <!-- Nút bấm -->
                        <div class="d-flex justify-content-between pt-2 border-top">
                            <a th:href="@{/products}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
                            </a>
                            <button type="submit" class="btn btn-warning px-4 fw-semibold">
                                <i class="bi bi-check2-circle me-1"></i>Lưu thay đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
