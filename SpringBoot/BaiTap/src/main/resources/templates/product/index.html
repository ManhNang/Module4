<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm - Quản lý sản phẩm</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/products}">
            <i class="bi bi-box-seam me-2"></i>Product Manager
        </a>
    </div>
</nav>

<div class="container py-4">
    <!-- Header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <h2 class="text-primary fw-bold mb-1">
                <i class="bi bi-boxes me-2"></i>Quản lý danh sách sản phẩm
            </h2>
            <p class="text-muted mb-0">Hệ thống quản lý thông tin sản phẩm chuẩn Spring Boot & Thymeleaf</p>
        </div>
        <div class="mt-2 mt-md-0">
            <a th:href="@{/products/create}" class="btn btn-success shadow-sm">
                <i class="bi bi-plus-circle me-1"></i>Thêm mới sản phẩm
            </a>
        </div>
    </div>

    <!-- Alert messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Search bar -->
    <div class="card shadow-sm mb-4 border-0">
        <div class="card-body">
            <form th:action="@{/products}" method="get" class="row g-2 align-items-center">
                <div class="col-md-9 col-sm-8">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" name="search" th:value="${search}" class="form-control"
                               placeholder="Tìm kiếm theo tên sản phẩm...">
                    </div>
                </div>
                <div class="col-md-3 col-sm-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">
                        <i class="bi bi-search me-1"></i>Tìm kiếm
                    </button>
                    <a th:href="@{/products}" class="btn btn-outline-secondary" title="Làm mới">
                        <i class="bi bi-arrow-clockwise"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Products Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary text-nowrap">
                        <tr>
                            <th class="text-center" style="width: 5%;">#ID</th>
                            <th style="width: 25%;">Tên sản phẩm</th>
                            <th class="text-end" style="width: 15%;">Giá (VNĐ)</th>
                            <th style="width: 15%;">Nhà sản xuất</th>
                            <th style="width: 25%;">Mô tả</th>
                            <th class="text-center" style="width: 15%;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                Không có sản phẩm nào được tìm thấy.
                            </td>
                        </tr>
                        <tr th:each="product : ${products}">
                            <td class="text-center fw-bold text-secondary" th:text="${product.id}">1</td>
                            <td>
                                <a th:href="@{/products/{id}/view(id=${product.id})}"
                                   class="text-decoration-none fw-semibold text-dark hover-primary"
                                   th:text="${product.name}">Tên sản phẩm</a>
                            </td>
                            <td class="text-end text-danger fw-bold"
                                th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                                10.000.000 ₫
                            </td>
                            <td>
                                <span class="badge bg-info text-dark" th:text="${product.manufacturer}">Hãng</span>
                            </td>
                            <td class="text-truncate text-muted" style="max-width: 220px;"
                                th:text="${product.description}" th:title="${product.description}">Mô tả</td>
                            <td class="text-center text-nowrap">
                                <a th:href="@{/products/{id}/view(id=${product.id})}"
                                   class="btn btn-sm btn-outline-info me-1" title="Xem chi tiết">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/products/{id}/edit(id=${product.id})}"
                                   class="btn btn-sm btn-outline-warning me-1" title="Chỉnh sửa">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/products/{id}/delete(id=${product.id})}"
                                   class="btn btn-sm btn-outline-danger" title="Xoá">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white text-muted py-3">
            <div class="d-flex justify-content-between align-items-center">
                <span>Tổng số: <strong th:text="${#lists.size(products)}">0</strong> sản phẩm</span>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
