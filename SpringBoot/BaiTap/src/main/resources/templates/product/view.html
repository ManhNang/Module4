<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - Quản lý sản phẩm</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/products}">
            <i class="bi bi-box-seam me-2"></i>Product Manager
        </a>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/products}" class="text-decoration-none">Sản phẩm</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Chi tiết sản phẩm #<span th:text="${product.id}"></span></li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-info bg-gradient text-white py-3">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-info-circle me-2"></i>Thông tin chi tiết sản phẩm</h4>
                </div>
                <div class="card-body p-4">
                    <div class="mb-3 pb-3 border-bottom">
                        <span class="text-muted small">Mã sản phẩm</span>
                        <h5 class="fw-bold text-secondary mb-0">#<span th:text="${product.id}">1</span></h5>
                    </div>

                    <div class="mb-3 pb-3 border-bottom">
                        <span class="text-muted small">Tên sản phẩm</span>
                        <h3 class="fw-bold text-dark mb-0" th:text="${product.name}">Tên sản phẩm</h3>
                    </div>

                    <div class="mb-3 pb-3 border-bottom">
                        <span class="text-muted small">Giá niêm yết</span>
                        <h4 class="fw-bold text-danger mb-0"
                            th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                            10.000.000 ₫
                        </h4>
                    </div>

                    <div class="mb-3 pb-3 border-bottom">
                        <span class="text-muted small">Nhà sản xuất</span>
                        <div class="mt-1">
                            <span class="badge bg-primary fs-6 px-3 py-2" th:text="${product.manufacturer}">Hãng</span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <span class="text-muted small">Mô tả sản phẩm</span>
                        <p class="mt-2 text-secondary lead fs-6" style="white-space: pre-line;"
                           th:text="${product.description ?: 'Không có mô tả chi tiết.'}">
                            Mô tả sản phẩm...
                        </p>
                    </div>

                    <div class="d-flex justify-content-between pt-3 border-top">
                        <a th:href="@{/products}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
                        </a>
                        <div class="d-flex gap-2">
                            <a th:href="@{/products/{id}/edit(id=${product.id})}" class="btn btn-warning">
                                <i class="bi bi-pencil-square me-1"></i>Chỉnh sửa
                            </a>
                            <a th:href="@{/products/{id}/delete(id=${product.id})}" class="btn btn-outline-danger">
                                <i class="bi bi-trash me-1"></i>Xoá
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
