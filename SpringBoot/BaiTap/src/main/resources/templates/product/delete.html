<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận xoá sản phẩm - Quản lý sản phẩm</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/products}">
            <i class="bi bi-box-seam me-2"></i>Product Manager
        </a>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/products}" class="text-decoration-none">Sản phẩm</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Xác nhận xoá</li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0 border-danger border-top border-4">
                <div class="card-body p-4 text-center">
                    <div class="text-danger mb-3">
                        <i class="bi bi-exclamation-octagon fs-1"></i>
                    </div>
                    <h4 class="card-title fw-bold text-danger mb-2">Bạn có chắc chắn muốn xoá?</h4>
                    <p class="text-muted mb-4">Hành động này không thể hoàn tác. Toàn bộ thông tin của sản phẩm dưới đây sẽ bị xoá khỏi cơ sở dữ liệu:</p>

                    <div class="card bg-light border-0 mb-4 text-start">
                        <div class="card-body">
                            <ul class="list-unstyled mb-0">
                                <li class="mb-2"><strong>Mã sản phẩm:</strong> <span class="badge bg-secondary" th:text="${product.id}"></span></li>
                                <li class="mb-2"><strong>Tên sản phẩm:</strong> <span class="fw-bold text-dark" th:text="${product.name}"></span></li>
                                <li class="mb-2"><strong>Giá bán:</strong> <span class="text-danger fw-bold" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span></li>
                                <li class="mb-2"><strong>Nhà sản xuất:</strong> <span class="badge bg-info text-dark" th:text="${product.manufacturer}"></span></li>
                                <li><strong>Mô tả:</strong> <span class="text-muted" th:text="${product.description}"></span></li>
                            </ul>
                        </div>
                    </div>

                    <form th:action="@{/products/delete}" method="post">
                        <input type="hidden" name="id" th:value="${product.id}" />
                        <div class="d-flex justify-content-center gap-3">
                            <a th:href="@{/products}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-x-circle me-1"></i>Huỷ bỏ
                            </a>
                            <button type="submit" class="btn btn-danger px-4">
                                <i class="bi bi-trash-fill me-1"></i>Xác nhận xoá
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
