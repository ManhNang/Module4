plugins {
    id 'java'
    id 'war'
}

group = 'com.codegym'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'org.springframework:spring-webmvc:6.2.6'
    implementation 'org.springframework.security:spring-security-web:6.2.6'
    implementation 'org.springframework.security:spring-security-config:6.2.6'
    implementation 'org.thymeleaf:thymeleaf-spring6:3.1.1.RELEASE'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.1.RELEASE'
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-parameters'
}

war {
    archiveFileName = 'wbds-2025-spring-security.war'
}

