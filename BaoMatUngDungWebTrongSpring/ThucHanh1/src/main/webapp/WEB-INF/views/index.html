<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title>Trang chủ - Spring Security 2025</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        line-height: 1.6;
      }
      .card {
        border: 1px solid #ddd;
        padding: 20px;
        border-radius: 8px;
        max-width: 500px;
      }
      .btn {
        display: inline-block;
        padding: 8px 16px;
        background: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        margin-right: 10px;
      }
      .btn-danger {
        background: #dc3545;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Chào mừng đến với hệ thống Spring Security 2025</h2>

      <div sec:authorize="isAnonymous()">
        <p>Bạn chưa đăng nhập vào hệ thống.</p>
        <a th:href="@{/login}" class="btn">Đăng nhập</a>
      </div>

      <div sec:authorize="isAuthenticated()">
        <p>Xin chào, <b sec:authentication="name">User</b>!</p>
        <p>
          Vai trò của bạn:
          <span sec:authentication="principal.authorities">ROLE</span>
        </p>
        <a th:href="@{/logout}" class="btn btn-danger">Đăng xuất</a>
      </div>

      <hr />

      <h3>Chức năng hệ thống:</h3>
      <ul>
        <li><a th:href="@{/user}">Khu vực User (/user)</a></li>
        <li><a th:href="@{/admin}">Khu vực Admin (/admin)</a></li>
      </ul>
    </div>
  </body>
</html>
