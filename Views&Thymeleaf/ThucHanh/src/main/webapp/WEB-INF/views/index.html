<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head th:replace="~{layout :: head}"></head>
  <body>
    <h3>Customers List</h3>
    <p><a th:href="@{/customers/create}" class="btn">Add new customer</a></p>

    <div class="notify">
      <div th:if="${success}">
        <span th:text="${success}"></span>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Address</th>
          <th>Edit</th>
          <th>Delete</th>
          <th>View</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="row : ${customers}">
          <td th:text="${row.name}"></td>
          <td th:text="${row.email}"></td>
          <td th:text="${row.address}"></td>
          <td><a th:href="@{/customers/{id}/edit(id=${row.id})}">edit</a></td>
          <td>
            <a th:href="@{/customers/{id}/delete(id=${row.id})}">delete</a>
          </td>
          <td><a th:href="@{/customers/{id}/view(id=${row.id})}">view</a></td>
        </tr>
      </tbody>
    </table>

    <footer th:replace="~{layout :: footer}"></footer>
  </body>
</html>
