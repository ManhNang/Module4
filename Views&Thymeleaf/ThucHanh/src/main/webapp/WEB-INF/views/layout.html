<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head th:fragment="head">
    <meta charset="UTF-8" />
    <title>Customer Management</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #4caf50;
        color: white;
      }
      .notify {
        color: green;
        font-weight: bold;
        margin-bottom: 10px;
      }
      a {
        text-decoration: none;
        color: #0275d8;
      }
      .btn {
        padding: 6px 12px;
        background: #4caf50;
        color: white;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <footer
      th:fragment="footer"
      style="margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px"
    >
      <p>&copy; 2026 CodeGym Customer Management</p>
    </footer>
  </body>
</html>
