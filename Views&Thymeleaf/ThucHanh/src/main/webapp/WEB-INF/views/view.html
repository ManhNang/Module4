<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head th:replace="~{layout :: head}"></head>
  <body>
    <h3>Customer Detail</h3>
    <p><a th:href="@{/customers}">Back to customer list</a></p>

    <div>
      <p><strong>Name:</strong> <span th:text="${customer.name}"></span></p>
      <p><strong>Email:</strong> <span th:text="${customer.email}"></span></p>
      <p>
        <strong>Address:</strong> <span th:text="${customer.address}"></span>
      </p>
    </div>

    <footer th:replace="~{layout :: footer}"></footer>
  </body>
</html>
