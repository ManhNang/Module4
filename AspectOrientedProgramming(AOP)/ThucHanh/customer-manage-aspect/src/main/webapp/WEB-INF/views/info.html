<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin chi tiết khách hàng</title>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #64748b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }

        .info-group {
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border);
        }

        .info-label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 14px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 500;
        }

        .actions {
            margin-top: 28px;
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #334155;
        }

        .btn-warning {
            background-color: #f59e0b;
            color: #ffffff;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Thông tin khách hàng</h1>

    <div class="info-group">
        <span class="info-label">ID khách hàng:</span>
        <span class="info-value" th:text="${customer.id}">1</span>
    </div>
    <div class="info-group">
        <span class="info-label">Họ và Tên:</span>
        <span class="info-value" th:text="${customer.name}">Nguyen Van A</span>
    </div>
    <div class="info-group">
        <span class="info-label">Email:</span>
        <span class="info-value" th:text="${customer.email}">nguyenvana@gmail.com</span>
    </div>
    <div class="info-group">
        <span class="info-label">Địa chỉ:</span>
        <span class="info-value" th:text="${customer.address}">Ha Noi</span>
    </div>

    <div class="actions">
        <a th:href="@{/customers}" class="btn btn-secondary">Quay lại danh sách</a>
        <a th:href="@{/customers/edit/{id}(id=${customer.id})}" class="btn btn-warning">Chỉnh sửa</a>
    </div>
</div>
</body>
</html>
