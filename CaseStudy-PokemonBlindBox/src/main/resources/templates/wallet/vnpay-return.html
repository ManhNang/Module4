<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Biên Lai Thanh Toán VNPay')}"></head>
<body class="min-h-screen flex flex-col">

<!-- Single-row Sticky Glass Navbar -->
<div th:replace="~{fragments/header :: navbar('wallet')}"></div>

<main class="mx-auto w-full max-w-2xl flex-1 px-4 py-12 sm:px-6 lg:px-8">

    <div class="pk-surface rounded-3xl p-8 space-y-6">

        <div class="text-center space-y-2">
            <div th:if="${paymentSuccess}"
                 class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-500/15 text-emerald-600 dark:text-emerald-400">
                <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 6 9 17l-5-5"/>
                </svg>
            </div>
            <div th:unless="${paymentSuccess}"
                 class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-rose-500/15 text-rose-600">
                <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
            </div>

            <h1 class="text-2xl font-extrabold pk-text-primary"
                th:text="${paymentSuccess} ? 'Nạp Điểm Thành Công!' : 'Giao Dịch Chưa Hoàn Tất'">
                Nạp Điểm Thành Công!
            </h1>
            <p class="text-xs sm:text-sm pk-text-secondary">
                Xác thực bảo mật:
                <span th:if="${signatureValid}" class="font-bold text-emerald-600 dark:text-emerald-400">Chữ ký hợp lệ</span>
                <span th:unless="${signatureValid}" class="font-bold text-rose-600">Chữ ký không hợp lệ</span>
            </p>
        </div>

        <!-- Chi tiết biên lai -->
        <div class="pk-surface-elevated rounded-2xl p-5 space-y-3 text-sm">
            <div class="flex items-center justify-between py-1.5 border-b border-slate-200 dark:border-slate-800">
                <span class="pk-text-secondary">Mã tham chiếu:</span>
                <span class="pk-num font-bold pk-text-primary" th:text="${vnpTxnRef}">VNP1_20261118</span>
            </div>
            <div class="flex items-center justify-between py-1.5 border-b border-slate-200 dark:border-slate-800">
                <span class="pk-text-secondary">Số tiền nạp:</span>
                <span class="pk-num text-base font-extrabold text-emerald-600 dark:text-emerald-400"
                      th:text="${#numbers.formatDecimal(displayAmount, 0, 'POINT', 0, 'COMMA')} + ' ₫'">200.000 ₫</span>
            </div>
            <div class="flex items-center justify-between py-1.5">
                <span class="pk-text-secondary">Ngân hàng / Mã giao dịch:</span>
                <span class="pk-num font-semibold pk-text-primary" th:text="${vnpBankCode} + ' • #' + ${vnpTransactionNo}">NCB • #14500991</span>
            </div>
        </div>

        <!-- Số dư mới sau giao dịch -->
        <div class="pk-surface-muted rounded-2xl p-4 flex items-center justify-between">
            <span class="text-xs sm:text-sm font-semibold pk-text-secondary">Số dư Ví khả dụng hiện tại:</span>
            <span class="pk-num text-xl font-extrabold text-emerald-600 dark:text-emerald-400"
                  th:text="${#numbers.formatDecimal(wallet.balance(), 0, 'POINT', 0, 'COMMA')} + ' ₫'">
                2.700.000 ₫
            </span>
        </div>

        <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
            <a th:href="@{/wallet}"
               class="pk-btn-primary rounded-xl px-5 py-2.5 text-xs sm:text-sm font-extrabold">
                Quay lại Ví Điện Tử
            </a>
            <a th:href="@{/store}"
               class="pk-surface-muted rounded-xl px-5 py-2.5 text-xs sm:text-sm font-bold pk-text-primary">
                Mở Gói Bài Tại Cửa Hàng
            </a>
        </div>
    </div>

</main>

<div th:replace="~{fragments/header :: commonScripts}"></div>
</body>
</html>
