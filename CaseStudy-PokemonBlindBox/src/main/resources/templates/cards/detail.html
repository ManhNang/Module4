<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${card.name()} + ' (' + ${card.formattedCardNumber()} + ')')}"></head>
<body class="min-h-screen flex flex-col">

<!-- Single-row Sticky Glass Navbar -->
<div th:replace="~{fragments/header :: navbar('inventory')}"></div>

<main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6 lg:px-8 space-y-8">

    <!-- Thanh điều hướng phía trên & Chuyển nhanh giữa các thẻ trong bộ -->
    <div class="flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-2.5">
            <a th:href="@{/inventory}"
               class="pk-surface rounded-full px-4 py-2 text-xs font-bold pk-text-primary hover:opacity-80 transition inline-flex items-center gap-1.5">
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
                <span>Quay lại Kho đồ</span>
            </a>
            <a th:href="@{/store}"
               class="pk-surface-muted rounded-full px-3.5 py-2 text-xs font-semibold pk-text-secondary hover:pk-text-primary transition">
                Cửa hàng Box
            </a>
        </div>
    </div>

    <!-- ==================== KHUNG CHI TIẾT THẺ BÀI 2 CỘT ==================== -->
    <section class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- Cột trái (5/12): Lá bài Pokémon tràn viền (Full-Bleed 63:88) kèm 3D Tilt & Holographic Foil -->
        <div class="lg:col-span-5 flex flex-col items-center">
            <div id="detail-card-showcase"
                 th:classappend="${isHoloRarity} ? 'is-holo-active' : ''"
                 class="pk-holo-card pk-card-fullbleed cursor-grab active:cursor-grabbing select-none">
                <img th:src="${card.imageUrl()}"
                     th:alt="${card.name()}"
                     onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/384.png'"/>
            </div>
        </div>

        <!-- ==================== CỘT PHẢI (7/12): BẢNG THÔNG SỐ THẺ BÀI (KHỚP CHÍNH XÁC BỐ CỤC MẪU) ==================== -->
        <div class="lg:col-span-7 space-y-6">

            <div class="pk-surface rounded-3xl p-7 sm:p-9 space-y-6">

                <!-- 1a. Tiêu đề lớn: Tên thẻ bài (VD: "Hầm hào huyền thoại") -->
                <div class="flex flex-wrap items-start justify-between gap-4 pb-2">
                    <div>
                        <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight pk-text-primary"
                            th:text="${card.name()}">
                            Hầm hào huyền thoại
                        </h1>
                    </div>

                    <!-- Huy hiệu trạng thái sở hữu trong Kho đồ -->
                    <div>
                        <span th:if="${ownedCopiesCount > 0}"
                              class="pk-num inline-flex items-center gap-1.5 rounded-full bg-emerald-500/15 px-3.5 py-1.5 text-xs font-extrabold text-emerald-600 dark:text-emerald-400 border border-emerald-500/30">
                            <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
                            <span th:text="'Đã có trong Kho đồ (x' + ${ownedCopiesCount} + ')'">Đã có trong Kho đồ (x3)</span>
                        </span>
                        <span th:if="${ownedCopiesCount == 0}"
                              class="inline-flex items-center gap-1.5 rounded-full pk-surface-muted px-3.5 py-1.5 text-xs font-bold pk-text-secondary">
                            <span>Chưa sở hữu trong Kho đồ</span>
                        </span>
                    </div>
                </div>

                <!-- 1b. 4 Dòng thuộc tính có Icon SVG đồng bộ bên trái, nhãn in đậm bên trái và giá trị căn phải -->
                <div class="divide-y divide-slate-200/80 dark:divide-slate-800/80 border-t border-b border-slate-200/80 dark:border-slate-800/80">

                    <!-- Dòng i: # | Số | "098 / 103" -->
                    <div class="flex items-center justify-between py-4 gap-4">
                        <div class="flex items-center gap-3.5">
                            <span class="flex h-8 w-8 items-center justify-center rounded-lg pk-surface-muted pk-text-secondary">
                                <!-- Icon # (Hash SVG, stroke-width: 1.75) -->
                                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="4" x2="20" y1="9" y2="9"/>
                                    <line x1="4" x2="20" y1="15" y2="15"/>
                                    <line x1="10" x2="8" y1="3" y2="21"/>
                                    <line x1="16" x2="14" y1="3" y2="21"/>
                                </svg>
                            </span>
                            <span class="text-sm sm:text-base font-bold pk-text-primary">Số</span>
                        </div>
                        <div class="pk-num text-sm sm:text-base font-semibold pk-text-primary text-right"
                             th:text="${card.formattedCardNumber()}">
                            098 / 103
                        </div>
                    </div>

                    <!-- Dòng ii: ☆ | Độ Hiếm | "Không phổ biến" -->
                    <div class="flex items-center justify-between py-4 gap-4">
                        <div class="flex items-center gap-3.5">
                            <span class="flex h-8 w-8 items-center justify-center rounded-lg pk-surface-muted pk-text-secondary">
                                <!-- Icon ☆ (Star Outline SVG, stroke-width: 1.75) -->
                                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                                </svg>
                            </span>
                            <span class="text-sm sm:text-base font-bold pk-text-primary">Độ Hiếm</span>
                        </div>
                        <div class="text-sm sm:text-base font-semibold pk-text-primary text-right"
                             th:text="${card.rarityName()}">
                            Không phổ biến
                        </div>
                    </div>

                    <!-- Dòng iii: ❖ | Bộ thẻ | Link gạch chân "Delta Reign" (chuyển sang /market lọc sẵn bộ Delta Reign) -->
                    <div class="flex items-center justify-between py-4 gap-4">
                        <div class="flex items-center gap-3.5">
                            <span class="flex h-8 w-8 items-center justify-center rounded-lg pk-surface-muted pk-text-secondary">
                                <!-- Icon ❖ (Four-Diamond Emblem SVG, stroke-width: 1.75) -->
                                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="12 2 15 7 12 12 9 7 12 2"/>
                                    <polygon points="12 12 15 17 12 22 9 17 12 12"/>
                                    <polygon points="2 12 7 9 12 12 7 15 2 12"/>
                                    <polygon points="12 12 17 9 22 12 17 15 12 12"/>
                                </svg>
                            </span>
                            <span class="text-sm sm:text-base font-bold pk-text-primary">Bộ thẻ</span>
                        </div>
                        <div class="text-right">
                            <a th:href="@{/market(setName=${card.setName()})}"
                               class="text-sm sm:text-base font-semibold pk-text-primary underline decoration-slate-400 underline-offset-4 hover:text-rose-600 dark:hover:text-amber-400 transition"
                               th:text="${card.setName()}">
                                Delta Reign
                            </a>
                        </div>
                    </div>

                    <!-- Dòng iv: ✦ | Loài | Link gạch chân tên loài -->
                    <div class="flex items-center justify-between py-4 gap-4">
                        <div class="flex items-center gap-3.5 flex-wrap">
                            <span class="flex h-8 w-8 items-center justify-center rounded-lg pk-surface-muted pk-text-secondary">
                                <!-- Icon ✦ (Four-Point Sparkle SVG, stroke-width: 1.75) -->
                                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 3c.5 4.5 4.5 8.5 9 9-4.5.5-8.5 4.5-9 9-.5-4.5-4.5-8.5-9-9 4.5-.5 8.5-4.5 9-9Z"/>
                                </svg>
                            </span>
                            <span class="text-sm sm:text-base font-bold pk-text-primary">Loài</span>
                        </div>
                        <div class="text-right">
                            <a th:href="@{/market(speciesName=${card.speciesName()})}"
                               class="text-sm sm:text-base font-semibold pk-text-primary underline decoration-slate-400 underline-offset-4 hover:text-rose-600 dark:hover:text-amber-400 transition"
                               th:text="${card.speciesName()}">
                                Hầm hào huyền thoại
                            </a>
                        </div>
                    </div>

                </div>

                <!-- Các nút hành động nhanh dưới bảng thông số -->
                <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
                    <div class="flex flex-wrap items-center gap-2.5">
                        <a th:href="@{/market(speciesName=${card.speciesName()})}"
                           class="pk-btn-primary rounded-xl px-5 py-2.5 text-xs sm:text-sm font-extrabold inline-flex items-center gap-2">
                            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"/>
                                <path d="m21 21-4.3-4.3"/>
                            </svg>
                            <span>Tìm mua thẻ cùng Loài trên Sàn P2P</span>
                        </a>

                        <a th:if="${firstUnlockedUserCardId != null}"
                           th:href="@{/market(sellUserCardId=${firstUnlockedUserCardId})}"
                           class="pk-surface-elevated rounded-xl px-4 py-2.5 text-xs sm:text-sm font-bold pk-text-primary hover:opacity-80 transition">
                            Đem bán bản sao đang có
                        </a>
                    </div>

                    <a th:href="@{/inventory(tab='masterset')}"
                       class="text-xs font-bold pk-text-secondary hover:pk-text-primary underline underline-offset-4">
                        Xem vị trí trong lưới 103 ô →
                    </a>
                </div>
            </div>

        </div>
    </section>

</main>

<div th:replace="~{fragments/header :: commonScripts}"></div>
</body>
</html>
