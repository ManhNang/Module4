<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Đăng ký')}"></head>
<body class="min-h-screen flex flex-col justify-center items-center px-4 py-8">

<div class="pk-surface w-full max-w-4xl rounded-3xl overflow-hidden grid grid-cols-1 lg:grid-cols-12 shadow-2xl">

    <!-- Cột trái (5/12): Banner Thương Hiệu Tổng Quát (Dịu mắt trên Dark Theme) -->
    <div class="hidden lg:flex lg:col-span-5 relative overflow-hidden bg-gradient-to-br from-indigo-900 via-rose-700 to-amber-600 dark:from-slate-900 dark:via-indigo-950 dark:to-amber-950/85 p-8 text-white flex-col justify-between">
        <svg class="pointer-events-none absolute -right-16 -bottom-16 h-64 w-64 text-white/10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <circle cx="12" cy="12" r="9"></circle>
            <circle cx="12" cy="12" r="2.5"></circle>
            <line x1="3" y1="12" x2="9.5" y2="12"></line>
            <line x1="14.5" y1="12" x2="21" y2="12"></line>
        </svg>

        <a th:href="@{/login}" class="relative z-10 flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-white/15 backdrop-blur-md border border-white/25 shrink-0">
                <svg class="h-6 w-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <circle cx="12" cy="12" r="9"></circle>
                    <circle cx="12" cy="12" r="2.5"></circle>
                    <line x1="3" y1="12" x2="9.5" y2="12"></line>
                    <line x1="14.5" y1="12" x2="21" y2="12"></line>
                </svg>
            </div>
            <div>
                <div class="text-lg font-extrabold tracking-tight">Pokémon Blindbox</div>
                <div class="text-xs text-white/90">TCG Gacha &amp; Idle Sanctuary</div>
            </div>
        </a>

        <div class="relative z-10 my-auto space-y-3">
            <span class="inline-block rounded-full bg-white/15 px-3 py-1 text-[11px] font-bold uppercase tracking-wider">
                Quà Tân Thủ
            </span>
            <h2 class="text-2xl sm:text-[26px] font-extrabold leading-snug [text-wrap:balance]">
                Tặng Ngay <span class="pk-num text-amber-300">1.000 Xu</span> Khởi Đầu
            </h2>
            <p class="text-xs sm:text-sm text-white/90 leading-relaxed [text-wrap:pretty]">
                Mở ngay những Booster Pack đầu tiên, hoàn thiện bộ sưu tập thẻ bài 3D và thả Pokémon lên Đảo thu hoạch Xu mỗi ngày.
            </p>
        </div>
    </div>

    <!-- Cột phải (7/12): Form Đăng ký tinh gọn -->
    <div class="lg:col-span-7 p-6 sm:p-9 flex flex-col justify-center space-y-5">
        <div class="flex lg:hidden items-center justify-between gap-2 pb-3 border-b border-slate-200 dark:border-slate-800">
            <a th:href="@{/login}" class="flex items-center gap-2.5">
                <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-rose-600 text-white shadow-md">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                        <circle cx="12" cy="12" r="9"></circle>
                        <circle cx="12" cy="12" r="2.5"></circle>
                        <line x1="3" y1="12" x2="9.5" y2="12"></line>
                        <line x1="14.5" y1="12" x2="21" y2="12"></line>
                    </svg>
                </div>
                <div class="text-sm font-extrabold pk-text-primary leading-tight">Pokémon Blindbox</div>
            </a>
            <span class="rounded-full bg-amber-500/15 px-2.5 py-0.5 text-[10px] font-extrabold text-amber-600 dark:text-amber-400 pk-num">
                +1.000 Xu
            </span>
        </div>

        <div class="flex items-center justify-between gap-3">
            <h1 class="text-2xl font-extrabold pk-text-primary">Đăng ký</h1>
            <button type="button" onclick="window.toggleBlindboxTheme()" title="Đổi giao diện Sáng / Tối"
                    class="flex h-9 w-9 items-center justify-center rounded-full pk-surface-muted cursor-pointer transition shrink-0">
                <svg id="theme-icon-moon" class="h-4 w-4 pk-text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                </svg>
                <svg id="theme-icon-sun" class="h-4 w-4 text-amber-400 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2"></path><path d="M12 20v2"></path>
                    <path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path>
                    <path d="M2 12h2"></path><path d="M20 12h2"></path>
                    <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
                </svg>
            </button>
        </div>

        <div th:if="${errorMessage != null}"
             class="rounded-2xl border border-rose-500/50 bg-rose-500/10 p-3.5 text-xs sm:text-sm font-semibold text-rose-600 dark:text-rose-400"
             th:text="${errorMessage}">
        </div>

        <form th:action="@{/register}" method="post" class="space-y-3.5">
            <div>
                <label for="username" class="block text-xs font-bold pk-text-secondary mb-1">Tên đăng nhập *</label>
                <input type="text" id="username" name="username" required minlength="3"
                       th:value="${username}" placeholder="VD: trainer_red"
                       class="pk-input w-full rounded-xl px-4 py-2.5 text-sm font-semibold"/>
            </div>

            <div>
                <label for="email" class="block text-xs font-bold pk-text-secondary mb-1">Email *</label>
                <input type="email" id="email" name="email" required
                       th:value="${email}" placeholder="trainer@pokemon-blindbox.vn"
                       class="pk-input w-full rounded-xl px-4 py-2.5 text-sm font-semibold"/>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                <div>
                    <label for="password" class="block text-xs font-bold pk-text-secondary mb-1">Mật khẩu (≥ 6 ký tự) *</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required minlength="6"
                               placeholder="••••••••"
                               class="pk-input w-full rounded-xl pl-4 pr-11 py-2.5 text-sm font-semibold"/>
                        <button type="button"
                                onclick="window.togglePasswordVisibility('password', this)"
                                aria-label="Hiện hoặc ẩn mật khẩu"
                                class="absolute right-3 top-1/2 -translate-y-1/2 flex h-7 w-7 items-center justify-center rounded-lg pk-text-secondary hover:pk-text-primary cursor-pointer transition">
                            <svg class="icon-eye h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off h-4 w-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                <line x1="2" x2="22" y1="2" y2="22"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div>
                    <label for="confirmPassword" class="block text-xs font-bold pk-text-secondary mb-1">Xác nhận mật khẩu *</label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6"
                               placeholder="••••••••"
                               class="pk-input w-full rounded-xl pl-4 pr-11 py-2.5 text-sm font-semibold"/>
                        <button type="button"
                                onclick="window.togglePasswordVisibility('confirmPassword', this)"
                                aria-label="Hiện hoặc ẩn mật khẩu xác nhận"
                                class="absolute right-3 top-1/2 -translate-y-1/2 flex h-7 w-7 items-center justify-center rounded-lg pk-text-secondary hover:pk-text-primary cursor-pointer transition">
                            <svg class="icon-eye h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off h-4 w-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                <line x1="2" x2="22" y1="2" y2="22"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit"
                    class="pk-btn-primary w-full rounded-xl py-3.5 text-sm font-extrabold cursor-pointer mt-2">
                Đăng ký
            </button>
        </form>

        <div class="text-center text-xs pk-text-secondary pt-2 border-t border-slate-200 dark:border-slate-800">
            Đã có tài khoản?
            <a th:href="@{/login}" class="font-extrabold text-amber-600 dark:text-amber-400 hover:underline ml-1">
                Đăng nhập →
            </a>
        </div>
    </div>
</div>

<script defer th:src="@{/js/pages/auth.js(v='20261121k')}"></script>
</body>
</html>
