spring:
  application:
    name: pokemon-blindbox
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  thymeleaf:
    cache: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 30d
          cache-public: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pokemon_blindbox?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:50}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: 10000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      repositories:
        enabled: false
  session:
    redis:
      namespace: pokemon:blindbox:session

app:
  security:
    remember-me-key: ${APP_REMEMBER_ME_KEY:change-me-in-prod}
  websocket:
    allowed-origins: ${APP_WS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
    broker-relay:
      enabled: ${APP_WS_RELAY_ENABLED:false}
      host: ${APP_WS_RELAY_HOST:localhost}
      port: ${APP_WS_RELAY_PORT:61613}
  auction:
    settlement-delay-ms: ${APP_AUCTION_SETTLEMENT_DELAY_MS:10000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:thwphzkq}
  api-key: ${CLOUDINARY_API_KEY:241294794151565}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: pokemon-blindbox/cards

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:DEMO_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET:DEMO_VNPAY_HMAC_SHA512_SECRET_KEY_2026}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/wallet/vnpay-return}
  version: 2.1.0
  command: pay
  curr-code: VND
  order-type: topup
  expire-minutes: 15

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
