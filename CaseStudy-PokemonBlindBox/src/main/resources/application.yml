spring:
  application:
    name: pokemon-blindbox
  config:
    import: optional:classpath:application-local.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  thymeleaf:
    cache: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 30d
          cache-public: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pokemon_blindbox?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 10000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL:false}
      repositories:
        enabled: false
  session:
    store-type: ${SPRING_SESSION_STORE_TYPE:none}
    redis:
      namespace: pokemon:blindbox:session

app:
  security:
    remember-me-key: ${APP_REMEMBER_ME_KEY:change-me-in-prod}
  websocket:
    allowed-origins: ${APP_WS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
    broker-relay:
      enabled: ${APP_WS_RELAY_ENABLED:false}
      host: ${APP_WS_RELAY_HOST:localhost}
      port: ${APP_WS_RELAY_PORT:61613}
  auction:
    settlement-delay-ms: ${APP_AUCTION_SETTLEMENT_DELAY_MS:10000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:pokemon-blindbox/cards}

sepay:
  bank-code: ${SEPAY_BANK_CODE:MB}
  account-number: ${SEPAY_ACCOUNT_NUMBER:}
  account-name: ${SEPAY_ACCOUNT_NAME:}
  webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}
  qr-template: ${SEPAY_QR_TEMPLATE:compact}
  code-prefix: ${SEPAY_CODE_PREFIX:PKM}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
