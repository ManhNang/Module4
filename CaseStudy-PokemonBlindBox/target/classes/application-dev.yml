# Cấu hình dành riêng cho môi trường phát triển nội bộ (dev)
# Loại trừ SessionAutoConfiguration trên local dev khi chưa chạy Redis Server (Spring Boot 3.x)
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  thymeleaf:
    cache: false
    prefix: file:src/main/resources/templates/
  web:
    resources:
      static-locations: file:src/main/resources/static/,classpath:/static/
      cache:
        cachecontrol:
          max-age: 0s
          must-revalidate: true
          cache-public: true
      chain:
        strategy:
          content:
            enabled: false
  jpa:
    properties:
      hibernate:
        format_sql: true
