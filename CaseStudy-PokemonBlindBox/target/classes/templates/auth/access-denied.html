<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('403 - Từ Chối Truy Cập')}"></head>
<body class="min-h-screen flex flex-col">

<div th:replace="~{fragments/header :: navbar('store')}"></div>

<main class="mx-auto flex w-full max-w-xl flex-1 flex-col items-center justify-center px-4 py-12 text-center">
    <div class="pk-surface rounded-3xl p-8 sm:p-10 space-y-5 w-full">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-rose-500/15 text-rose-600">
            <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>

        <div class="space-y-2">
            <span class="rounded-full bg-rose-500/10 px-3 py-1 text-xs font-extrabold uppercase tracking-wider text-rose-600">
                403 Forbidden
            </span>
            <h1 class="text-2xl font-extrabold pk-text-primary">
                Khu Vực Dành Riêng Cho Quản Trị Viên
            </h1>
            <p class="text-sm pk-text-secondary leading-relaxed">
                Tài khoản hiện tại của bạn không có quyền truy cập vào Trung tâm Quản trị (<strong class="pk-text-primary">ROLE_ADMIN</strong>).
            </p>
        </div>

        <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
            <a th:href="@{/store}"
               class="pk-btn-primary rounded-xl px-5 py-2.5 text-xs sm:text-sm font-extrabold">
                Về Cửa Hàng Box
            </a>
            <a th:href="@{/logout}"
               class="pk-surface-muted rounded-xl px-5 py-2.5 text-xs sm:text-sm font-bold pk-text-primary">
                Đổi sang tài khoản Admin
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/header :: commonScripts}"></div>
</body>
</html>
