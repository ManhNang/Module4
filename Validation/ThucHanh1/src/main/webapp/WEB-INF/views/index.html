<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Khai báo thông tin người dùng</title>
    <style>
      .error {
        color: red;
        font-style: italic;
      }
      .form-group {
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <h2>Nhập thông tin người dùng</h2>

    <form th:action="@{/validateUser}" th:object="${user}" method="post">
      <div class="form-group">
        <label for="name">Tên:</label>
        <input type="text" id="name" th:field="*{name}" />
        <span
          class="error"
          th:if="${#fields.hasErrors('name')}"
          th:errors="*{name}"
        ></span>
      </div>

      <div class="form-group">
        <label for="age">Tuổi:</label>
        <input type="number" id="age" th:field="*{age}" />
        <span
          class="error"
          th:if="${#fields.hasErrors('age')}"
          th:errors="*{age}"
        ></span>
      </div>

      <button type="submit">Gửi thông tin</button>
    </form>
  </body>
</html>
