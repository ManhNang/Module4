<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Bài Hát - Quản Lý Âm Nhạc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-bg: #ecfdf5;
            --success-text: #065f46;
            --success-border: #a7f3d0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-title h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title p {
            color: var(--text-muted);
            margin-top: 4px;
            font-size: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-edit {
            background-color: #f1f5f9;
            color: #334155;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
        }

        .btn-edit:hover {
            background-color: #e2e8f0;
            color: var(--primary);
        }

        .btn-delete {
            background-color: #fef2f2;
            color: var(--danger);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
        }

        .btn-delete:hover {
            background-color: #fee2e2;
        }

        .alert-success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
            padding: 14px 18px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #f8fafc;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            padding: 14px 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        td {
            padding: 16px 20px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #fafbfc;
        }

        .song-title-cell {
            font-weight: 600;
            color: var(--text-main);
        }

        .badge-genre {
            display: inline-block;
            background-color: #e0e7ff;
            color: #4338ca;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 500;
        }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            padding: 48px;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <div class="header-title">
            <h1>🎵 Danh Sách Bài Hát</h1>
            <p>Quản lý và validate thông tin bài hát trong hệ thống nghe nhạc cá nhân</p>
        </div>
        <a th:href="@{/songs/create}" class="btn btn-primary">
            + Thêm bài hát mới
        </a>
    </div>

    <div th:if="${message}" class="alert-success">
        <span>✓</span>
        <span th:text="${message}"></span>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th style="width: 80px;">STT</th>
                    <th>Tên Bài Hát</th>
                    <th>Nghệ Sĩ Thể Hiện</th>
                    <th>Thể Loại</th>
                    <th style="width: 170px;">Thao Tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="song, iterStat : ${songs}">
                    <td th:text="${iterStat.count}">1</td>
                    <td class="song-title-cell" th:text="${song.name}">Nơi này có anh</td>
                    <td th:text="${song.artist}">Sơn Tùng M-TP</td>
                    <td>
                        <span class="badge-genre" th:text="${song.genre}">Pop, RnB</span>
                    </td>
                    <td class="actions-cell">
                        <a th:href="@{/songs/edit/{id}(id=${song.id})}" class="btn btn-edit">Sửa</a>
                        <a th:href="@{/songs/delete/{id}(id=${song.id})}" class="btn btn-delete" onclick="return confirm('Bạn có chắc chắn muốn xóa bài hát này?');">Xóa</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(songs)}">
                    <td colspan="5" class="empty-state">
                        Chưa có bài hát nào trong danh sách. Hãy thêm bài hát mới!
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
