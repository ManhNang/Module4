<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Thông Báo Lỗi - Thư Viện Sách</title>
</head>
<body>
<div layout:fragment="content">

    <div class="row justify-content-center my-5">
        <div class="col-lg-6">

            <div class="card card-custom p-4 text-center border-danger border-opacity-50 shadow">
                <div class="mb-3">
                    <div class="d-inline-flex p-4 rounded-circle bg-danger-subtle text-danger mb-3">
                        <i class="fa-solid fa-triangle-exclamation fs-1"></i>
                    </div>
                    <span class="badge bg-danger text-uppercase px-3 py-2 rounded-pill d-block mx-auto mb-2" style="max-width: fit-content;"
                          th:text="${errorType != null ? errorType : 'SYSTEM_EXCEPTION'}">
                        OUT_OF_STOCK
                    </span>
                    <h3 class="fw-bold text-danger mb-2" th:text="${errorTitle != null ? errorTitle : 'ĐÃ XẢY RA LỖI'}">
                        HẾT SÁCH TRONG THƯ VIỆN
                    </h3>
                </div>

                <div class="alert alert-danger bg-danger-subtle border-0 rounded-3 p-3 my-3 text-start d-flex align-items-center gap-3">
                    <i class="fa-solid fa-circle-exclamation fs-3 text-danger flex-shrink-0"></i>
                    <div>
                        <strong class="d-block mb-1">Chi tiết thông báo:</strong>
                        <span th:text="${errorMessage}">Nội dung lỗi đã xảy ra.</span>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-2 mt-3">
                    <a th:href="@{${backUrl != null ? backUrl : '/books'}}" class="btn btn-outline-danger px-4 py-2 rounded-3 fw-semibold">
                        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại thao tác trước
                    </a>
                    <a th:href="@{/books}" class="btn btn-gradient px-4 py-2 rounded-3 fw-semibold">
                        <i class="fa-solid fa-house me-1"></i> Trang chủ Thư Viện
                    </a>
                </div>
            </div>

        </div>
    </div>

</div>
</body>
</html>
