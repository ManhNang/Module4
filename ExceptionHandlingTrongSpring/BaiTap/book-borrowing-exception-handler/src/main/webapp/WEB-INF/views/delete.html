<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Xóa Đầu Sách - Thư Viện</title>
</head>
<body>
<div layout:fragment="content">

    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card card-custom p-4 border-danger border-opacity-25 shadow-sm">
                <div class="text-center mb-3">
                    <div class="d-inline-flex p-3 rounded-circle bg-danger-subtle text-danger mb-2">
                        <i class="fa-solid fa-triangle-exclamation fs-1"></i>
                    </div>
                    <h3 class="fw-bold text-danger">Xác Nhận Xóa Cuốn Sách</h3>
                    <p class="text-muted small">Hành động này sẽ xóa hoàn toàn đầu sách này khỏi cơ sở dữ liệu thư viện!</p>
                </div>

                <div class="bg-light p-3 rounded-3 mb-4">
                    <ul class="list-unstyled mb-0">
                        <li class="mb-2"><strong>Mã sách (#ID):</strong> <span th:text="${book.id}">1</span></li>
                        <li class="mb-2"><strong>Tựa đề sách:</strong> <span class="text-primary fw-bold" th:text="${book.title}">Tên sách</span></li>
                        <li class="mb-2"><strong>Tác giả:</strong> <span th:text="${book.author}">Tác giả</span></li>
                        <li><strong>Số lượng hiện có:</strong> <span th:text="${book.quantity}">0</span> cuốn</li>
                    </ul>
                </div>

                <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post">
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/books}" class="btn btn-outline-secondary px-4 rounded-3">Hủy bỏ</a>
                        <button type="submit" class="btn btn-danger px-4 rounded-3 fw-semibold">
                            <i class="fa-solid fa-trash-can me-1"></i> Đồng Ý Xóa
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

</div>
</body>
</html>
