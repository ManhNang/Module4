<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <meta charset="UTF-8">
    <title>Chỉnh Sửa Khách Hàng</title>
</head>
<body>
    <header th:replace="~{layout :: header}"></header>

    <main>
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <div class="card-header">
                <h1 class="card-title">Cập Nhật Thông Tin</h1>
                <a th:href="@{/customers}" class="btn btn-secondary btn-sm">&larr; Quay lại</a>
            </div>

            <form th:action="@{/customers/update}" th:object="${customer}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label>Mã Khách Hàng (ID):</label>
                    <input type="text" class="form-control" th:value="*{id}" disabled style="background-color: #f1f5f9; cursor: not-allowed;" />
                </div>

                <div class="form-group">
                    <label for="name">Họ và Tên:</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Nhập họ và tên..." required />
                </div>

                <div class="form-group">
                    <label for="email">Địa Chỉ Email:</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Nhập địa chỉ email..." required />
                </div>

                <div class="form-group">
                    <label for="address">Địa Chỉ:</label>
                    <input type="text" id="address" th:field="*{address}" class="form-control" placeholder="Nhập địa chỉ..." required />
                </div>

                <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-warning">Cập Nhật</button>
                    <a th:href="@{/customers}" class="btn btn-secondary">Hủy Bỏ</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
