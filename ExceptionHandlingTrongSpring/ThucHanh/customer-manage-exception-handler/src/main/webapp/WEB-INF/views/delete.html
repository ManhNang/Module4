<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <meta charset="UTF-8">
    <title>Xóa Khách Hàng</title>
</head>
<body>
    <header th:replace="~{layout :: header}"></header>

    <main>
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <div class="card-header">
                <h1 class="card-title" style="color: var(--danger-color);">Xác Nhận Xóa Khách Hàng</h1>
                <a th:href="@{/customers}" class="btn btn-secondary btn-sm">&larr; Quay lại</a>
            </div>

            <div class="alert alert-danger">
                <strong>Cảnh báo:</strong> Hành động này không thể hoàn tác. Bạn có chắc chắn muốn xóa khách hàng dưới đây?
            </div>

            <div style="margin-bottom: 1.5rem;">
                <div class="detail-row">
                    <span class="detail-label">Mã Khách Hàng:</span>
                    <span class="detail-value" th:text="${customer.id}">1</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Họ và Tên:</span>
                    <span class="detail-value" th:text="${customer.name}">Nguyễn Văn A</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Email:</span>
                    <span class="detail-value" th:text="${customer.email}">vana@gmail.com</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Địa Chỉ:</span>
                    <span class="detail-value" th:text="${customer.address}">Hà Nội</span>
                </div>
            </div>

            <form th:action="@{/customers/delete}" method="post">
                <input type="hidden" name="id" th:value="${customer.id}" />
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-danger">Xác Nhận Xóa</button>
                    <a th:href="@{/customers}" class="btn btn-secondary">Hủy Bỏ</a>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
