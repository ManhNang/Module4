<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viết Bài Blog Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #2c3e50;
        }
        .form-card {
            border: none;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/blogs}">
            <i class="bi bi-journal-richtext text-primary fs-4"></i>
            <span>DevLog Personal</span>
        </a>
        <div class="ms-auto">
            <a th:href="@{/blogs}" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Về danh sách
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card form-card p-4 p-md-5">
                <div class="mb-4 pb-2 border-bottom">
                    <h3 class="fw-bold mb-1"><i class="bi bi-pencil-square text-primary me-2"></i>Viết bài blog mới</h3>
                    <p class="text-muted small mb-0">Điền thông tin và nội dung chi tiết bài viết của bạn</p>
                </div>

                <form th:action="@{/blogs/save}" th:object="${blog}" method="post">
                    <!-- Title -->
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Tiêu đề bài viết <span class="text-danger">*</span></label>
                        <input type="text" id="title" class="form-control form-control-lg" th:field="*{title}" placeholder="Nhập tiêu đề hấp dẫn cho bài viết..." required>
                    </div>

                    <!-- Author -->
                    <div class="mb-3">
                        <label for="author" class="form-label fw-semibold">Tác giả</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" id="author" class="form-control" th:field="*{author}" placeholder="Tên tác giả hoặc biệt danh...">
                        </div>
                    </div>

                    <!-- Summary -->
                    <div class="mb-3">
                        <label for="summary" class="form-label fw-semibold">Tóm tắt ngắn gọn</label>
                        <textarea id="summary" rows="3" class="form-control" th:field="*{summary}" placeholder="Tóm tắt nội dung bài viết trong 1-3 câu để hiển thị ở danh sách bài viết..."></textarea>
                        <div class="form-text">Phần tóm tắt sẽ xuất hiện ở trang chủ để người đọc nắm bắt nội dung nhanh chóng.</div>
                    </div>

                    <!-- Content -->
                    <div class="mb-4">
                        <label for="content" class="form-label fw-semibold">Nội dung chi tiết <span class="text-danger">*</span></label>
                        <textarea id="content" rows="12" class="form-control" th:field="*{content}" placeholder="Soạn thảo nội dung bài viết ở đây..." required></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                        <a th:href="@{/blogs}" class="btn btn-light px-4 rounded-pill">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary px-4 rounded-pill">
                            <i class="bi bi-cloud-arrow-up-fill me-1"></i> Xuất bản bài viết
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
