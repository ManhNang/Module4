<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${blog.title} + ' - DevLog Personal'">Chi Tiết Bài Viết</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #2c3e50;
        }
        .article-card {
            border: none;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .article-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #334155;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .summary-box {
            background-color: #f1f5f9;
            border-left: 4px solid #0284c7;
            padding: 1rem 1.25rem;
            border-radius: 6px;
            font-style: italic;
            color: #475569;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/blogs}">
            <i class="bi bi-journal-richtext text-primary fs-4"></i>
            <span>DevLog Personal</span>
        </a>
        <div class="ms-auto d-flex gap-2">
            <a th:href="@{/blogs}" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Danh sách blog
            </a>
            <a th:href="@{/blogs/create}" class="btn btn-primary btn-sm rounded-pill px-3">
                <i class="bi bi-plus-lg me-1"></i> Viết bài mới
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <article class="card article-card p-4 p-md-5">

                <!-- Meta Header -->
                <div class="mb-3">
                    <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill fw-medium">Bài viết chia sẻ</span>
                </div>

                <!-- Title -->
                <h1 class="display-6 fw-bold text-dark mb-3" th:text="${blog.title}">Tiêu đề bài viết</h1>

                <!-- Author & Timestamps -->
                <div class="d-flex flex-wrap align-items-center gap-3 text-muted small pb-4 mb-4 border-bottom">
                    <span>
                        <i class="bi bi-person-circle me-1 text-primary"></i>
                        <strong th:text="${blog.author != null ? blog.author : 'Ẩn danh'}">Tác giả</strong>
                    </span>
                    <span>•</span>
                    <span>
                        <i class="bi bi-calendar3 me-1"></i>
                        Ngày đăng: <span th:text="${blog.createdAt != null ? #temporals.format(blog.createdAt, 'dd/MM/yyyy HH:mm') : 'N/A'}"></span>
                    </span>
                    <span th:if="${blog.updatedAt != null and blog.updatedAt != blog.createdAt}">•</span>
                    <span th:if="${blog.updatedAt != null and blog.updatedAt != blog.createdAt}">
                        <i class="bi bi-arrow-repeat me-1"></i>
                        Cập nhật: <span th:text="${#temporals.format(blog.updatedAt, 'dd/MM/yyyy HH:mm')}"></span>
                    </span>
                </div>

                <!-- Summary Section -->
                <div th:if="${blog.summary != null and !#strings.isEmpty(blog.summary)}" class="summary-box mb-4">
                    <strong>Tóm tắt: </strong>
                    <span th:text="${blog.summary}"></span>
                </div>

                <!-- Main Content Body -->
                <div class="article-content mb-5" th:text="${blog.content}">
                    Nội dung chi tiết của bài blog sẽ xuất hiện ở đây...
                </div>

                <!-- Action Footer -->
                <div class="pt-4 border-top d-flex justify-content-between align-items-center">
                    <a th:href="@{/blogs}" class="btn btn-outline-secondary rounded-pill px-4">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại
                    </a>
                    <div class="d-flex gap-2">
                        <a th:href="@{/blogs/{id}/edit(id=${blog.id})}" class="btn btn-warning rounded-pill px-3">
                            <i class="bi bi-pencil me-1"></i> Chỉnh sửa
                        </a>
                        <a th:href="@{/blogs/{id}/delete(id=${blog.id})}" class="btn btn-outline-danger rounded-pill px-3">
                            <i class="bi bi-trash me-1"></i> Xóa bài viết
                        </a>
                    </div>
                </div>

            </article>
        </div>
    </div>
</div>

<footer class="mt-5 py-4 bg-white border-top text-center text-muted small">
    <div class="container">
        <p class="mb-0">Personal Blog System © 2026 - Powered by Spring MVC & Spring Data JPA</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
