plugins {
    id 'java'
    id 'war'
    id 'eclipse'
}

group = 'com.codegym'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Jakarta Servlet API for Tomcat 10.1+
    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // Spring Framework 6 (Tomcat 10.1+ / Jakarta EE 10 compatible)
    implementation 'org.springframework:spring-webmvc:6.1.14'
    implementation 'org.springframework:spring-orm:6.1.14'

    // Hibernate ORM 6 (Jakarta Persistence)
    implementation 'org.hibernate.orm:hibernate-core:6.4.4.Final'

    // MySQL Connector
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    // Thymeleaf Spring 6
    implementation 'org.thymeleaf:thymeleaf-spring6:3.1.2.RELEASE'

    // Spring Data JPA (Compatible with Spring 6.1)
    implementation 'org.springframework.data:spring-data-jpa:3.2.11'

    // Spring AOP & AspectJ
    implementation 'org.springframework:spring-aspects:6.1.14'
    implementation 'org.aspectj:aspectjweaver:1.9.22.1'

    // Logging: Logback Classic (SLF4J implementation)
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.springframework:spring-test:6.1.14'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

war {
    archiveFileName = "${project.name}.war"
}
