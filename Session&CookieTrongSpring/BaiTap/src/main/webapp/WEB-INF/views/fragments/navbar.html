<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important;">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4 text-white" th:href="@{/shop}">
            <i class="bi bi-shop text-primary fs-3"></i>
            <span>TechMart<span class="text-primary">.io</span></span>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link px-3" th:classappend="${activeTab == 'shop' ? 'active fw-bold text-white' : 'text-light-emphasis'}" th:href="@{/shop}">
                        <i class="bi bi-grid-fill me-1"></i> Cửa hàng
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/cart}" class="btn btn-outline-light position-relative rounded-pill px-4 py-2 d-flex align-items-center gap-2 shadow-sm"
                   th:classappend="${activeTab == 'cart' ? 'btn-light text-dark fw-bold' : ''}">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span>Giỏ hàng</span>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-2 border-dark"
                          th:text="${cart != null ? cart.countProductQuantity() : 0}">
                        0
                    </span>
                </a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
