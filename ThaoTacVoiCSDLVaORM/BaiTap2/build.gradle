plugins {
    id 'java'
    id 'war'
}

group = 'com.codegym'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Web MVC 6.2.6
    implementation 'org.springframework:spring-webmvc:6.2.6'
    implementation 'org.springframework:spring-orm:6.2.6'

    // Hibernate Core 6.x
    implementation 'org.hibernate.orm:hibernate-core:6.6.10.Final'

    // MySQL Connector Java 8.0.30 (Hoặc com.mysql:mysql-connector-j:8.0.33+)
    implementation 'mysql:mysql-connector-java:8.0.30'

    // Thymeleaf 3.1 for Spring 6
    implementation 'org.thymeleaf:thymeleaf-spring6:3.1.3.RELEASE'

    // Jakarta Servlet API 6.0.0 (Tomcat 10.1+)
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add("-parameters")
}

war {
    archiveFileName = 'img-of-the-day.war'
}
