plugins {
    id 'java'
    id 'war'
}

group = 'com.codegym'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Web MVC
    implementation 'org.springframework:spring-webmvc:6.2.6'

    // Hibernate Core
    implementation 'org.hibernate.orm:hibernate-core:6.6.13.Final'

    // MySQL Connector
    implementation 'mysql:mysql-connector-java:8.0.30'

    // Thymeleaf + Spring 6 integration
    implementation 'org.thymeleaf:thymeleaf-spring6:3.1.3.RELEASE'

    // Jakarta Servlet API (provided by Tomcat 10.1+)
    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.0.0'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

war {
    archiveFileName = 'customer-management.war'
}
