<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Bài Hát Mới - MelodyStream</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: rgba(22, 29, 47, 0.75);
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(255, 255, 255, 0.04);
            --input-focus: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-main);
        }

        .form-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .form-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-header .icon-badge {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--primary-gradient);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 10px 25px var(--accent-glow);
            margin-bottom: 1rem;
        }

        .form-header h2 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.4rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label span.required {
            color: #f87171;
        }

        .input-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.85rem 1.1rem;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-control:focus {
            background: var(--input-focus);
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        select.input-control {
            cursor: pointer;
        }

        select.input-control option {
            background: #1e293b;
            color: white;
        }

        /* File upload drop area */
        .file-upload-box {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .file-upload-box:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .file-upload-box input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .file-upload-box i {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .file-upload-box .file-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        .selected-file-name {
            font-size: 0.9rem;
            color: #34d399;
            font-weight: 600;
            margin-top: 0.6rem;
            word-break: break-all;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 0.9rem 1.5rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <a th:href="@{/songs}" class="back-link">
        <i class="bi bi-arrow-left"></i> Quay lại danh sách bài hát
    </a>

    <div class="form-card">
        <div class="form-header">
            <div class="icon-badge">
                <i class="bi bi-music-note"></i>
            </div>
            <h2>Thêm Bài Hát Mới</h2>
            <p>Tải lên tập tin âm thanh và chia sẻ giai điệu yêu thích của bạn</p>
        </div>

        <form th:action="@{/songs/create}" th:object="${songForm}" method="post" enctype="multipart/form-data">
            
            <!-- Tên bài hát -->
            <div class="form-group">
                <label for="name">Tên bài hát <span class="required">*</span></label>
                <input type="text" id="name" th:field="*{name}" class="input-control" placeholder="Ví dụ: Em Của Ngày Hôm Qua" required>
            </div>

            <!-- Nghệ sĩ thể hiện -->
            <div class="form-group">
                <label for="artist">Nghệ sĩ thể hiện <span class="required">*</span></label>
                <input type="text" id="artist" th:field="*{artist}" class="input-control" placeholder="Ví dụ: Sơn Tùng M-TP" required>
            </div>

            <!-- Thể loại nhạc -->
            <div class="form-group">
                <label for="genre">Thể loại nhạc</label>
                <input type="text" id="genre" th:field="*{genre}" class="input-control" placeholder="Ví dụ: V-Pop, Ballad, EDM, R&B, Rap/Hip-hop...">
            </div>

            <!-- File nhạc upload -->
            <div class="form-group">
                <label>Đường dẫn file bài hát (Tải lên)</label>
                <div class="file-upload-box">
                    <input type="file" id="musicFile" th:field="*{musicFile}" accept="audio/*, .mp3, .wav, .ogg, .m4a" onchange="displaySelectedFile(this)">
                    <i class="bi bi-cloud-arrow-up"></i>
                    <div><strong>Kéo thả hoặc nhấp để chọn tệp âm thanh</strong></div>
                    <div class="file-desc">Hỗ trợ định dạng MP3, WAV, OGG, M4A (Tối đa 50MB)</div>
                    <div class="selected-file-name" id="selectedFileName"></div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="form-actions">
                <a th:href="@{/songs}" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i> Hủy bỏ
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Lưu bài hát
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function displaySelectedFile(input) {
        const display = document.getElementById('selectedFileName');
        if (input.files && input.files[0]) {
            display.innerHTML = '<i class="bi bi-music-note-beamed"></i> Đã chọn: ' + input.files[0].name + ' (' + (input.files[0].size / (1024 * 1024)).toFixed(2) + ' MB)';
        } else {
            display.innerHTML = '';
        }
    }
</script>

</body>
</html>
