<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${song.name + ' - ' + song.artist + ' | MelodyStream'}">Đang phát - MelodyStream</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: rgba(22, 29, 47, 0.7);
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 25%, rgba(99, 102, 241, 0.2) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .btn-back:hover {
            color: var(--text-main);
        }

        .player-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 3rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        /* Left Side: Vinyl Record */
        .vinyl-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .vinyl-disc {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, #2b3345 20%, #0f172a 60%, #020617 100%);
            border: 8px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 35px var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: rotateVinyl 8s linear infinite;
        }

        .vinyl-disc.paused {
            animation-play-state: paused;
        }

        .vinyl-center {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 4px solid #0f172a;
        }

        @keyframes rotateVinyl {
            100% { transform: rotate(360deg); }
        }

        /* Right Side: Metadata and Controls */
        .song-details-pane {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .genre-pill {
            display: inline-block;
            align-self: flex-start;
            padding: 0.35rem 0.9rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 700;
            background: rgba(99, 102, 241, 0.18);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.35);
            margin-bottom: 1rem;
        }

        .song-title {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .song-artist {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .audio-player-box {
            margin-top: 1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem;
        }

        audio {
            width: 100%;
            filter: invert(1) hue-rotate(180deg);
            border-radius: 10px;
        }

        .quick-playlist {
            margin-top: 2rem;
        }

        .quick-playlist h4 {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 0.75rem;
        }

        .playlist-items {
            max-height: 180px;
            overflow-y: auto;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .playlist-item:hover, .playlist-item.active {
            background: rgba(99, 102, 241, 0.15);
            color: #c7d2fe;
        }

        @media (max-width: 768px) {
            .player-wrapper {
                grid-template-columns: 1fr;
                padding: 1.75rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a th:href="@{/songs}" class="btn-back">
            <i class="bi bi-chevron-left"></i> Quay lại danh sách
        </a>
        <div style="font-weight: 700; color: var(--primary);">MelodyStream HD Audio</div>
    </div>

    <div class="player-wrapper">
        <!-- Vinyl Record Visualizer -->
        <div class="vinyl-container">
            <div class="vinyl-disc" id="vinylDisc">
                <div class="vinyl-center">
                    <i class="bi bi-music-note"></i>
                </div>
            </div>
            <div style="margin-top: 1.5rem; color: var(--text-muted); font-size: 0.85rem;">
                <i class="bi bi-broadcast"></i> Phát nhạc chất lượng cao
            </div>
        </div>

        <!-- Song info & player -->
        <div class="song-details-pane">
            <span class="genre-pill" th:text="${song.genre != null and !song.genre.isEmpty() ? song.genre : 'Âm nhạc'}">Pop</span>
            <h1 class="song-title" th:text="${song.name}">Tên bài hát</h1>
            <div class="song-artist">
                <i class="bi bi-person"></i> <span th:text="${song.artist}">Nghệ sĩ</span>
            </div>

            <div class="audio-player-box">
                <audio id="mainAudio" controls autoplay>
                    <source th:if="${song.filePath != null and !song.filePath.isEmpty()}" 
                            th:src="@{'/uploads/' + ${song.filePath}}" 
                            type="audio/mpeg">
                    Trình duyệt của bạn không hỗ trợ phát âm thanh HTML5.
                </audio>
                <div th:if="${song.filePath == null or song.filePath.isEmpty()}" style="color: #f87171; font-size: 0.85rem; margin-top: 0.5rem;">
                    <i class="bi bi-exclamation-triangle"></i> Bài hát này chưa có file âm thanh! Hãy cập nhật bài hát để tải lên file nhạc.
                </div>
            </div>

            <!-- Playlist sidebar -->
            <div class="quick-playlist">
                <h4>Bài hát khác trong danh sách</h4>
                <div class="playlist-items">
                    <a th:each="item : ${playlist}" 
                       th:href="@{'/songs/play/' + ${item.id}}" 
                       th:class="'playlist-item ' + (${item.id == song.id} ? 'active' : '')">
                        <div>
                            <span th:text="${item.name}" style="font-weight: 600;">Tên bài</span>
                            <span style="font-size: 0.8rem; color: var(--text-muted); margin-left: 0.5rem;" th:text="${item.artist}">Nghệ sĩ</span>
                        </div>
                        <i class="bi" th:classappend="${item.id == song.id} ? 'bi-volume-up-fill' : 'bi-play'"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const audio = document.getElementById('mainAudio');
    const vinyl = document.getElementById('vinylDisc');

    if (audio) {
        audio.addEventListener('play', () => {
            vinyl.classList.remove('paused');
        });
        audio.addEventListener('pause', () => {
            vinyl.classList.add('paused');
        });
        audio.addEventListener('ended', () => {
            vinyl.classList.add('paused');
        });
    }
</script>

</body>
</html>
